[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vacspin"
version = "0.8.1"
description = "Group-IV colour-centre spin-photon interfaces: strained spin Hamiltonians, cyclicity, transition-resolved Purcell budgets and exact single-shot readout statistics"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Tanvir Mahmud Mahim"}]
keywords = ["quantum", "color-center", "SnV", "SiV", "diamond",
            "cavity-QED", "Purcell", "spin-photon-interface",
            "single-shot-readout"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/TaN-MM-Org/vacspin"
Issues = "https://github.com/TaN-MM-Org/vacspin/issues"
Changelog = "https://github.com/TaN-MM-Org/vacspin/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
